<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GASA TECH | Elite Calculator</title>
    <meta name="description" content="High-performance glassmorphic calculator by Gasa Tech.">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#0a0a0a">
</head>
<body>
    <div class="bg-blobs"></div> <main class="calculator-card">
        <header class="brand-header">
            <span class="brand">GASA TECH</span>
            <span class="greeting" id="greeting">Elite Edition</span>
        </header>

        <div class="display-container">
            <div class="history-log" id="history-log"></div>
            <div class="current-input" id="screen">0</div>
        </div>

        <div class="keypad">
            <button onclick="clearScreen()" class="btn-func">AC</button>
            <button onclick="deleteLast()" class="btn-func">DEL</button>
            <button onclick="appendValue('%')" class="btn-func">%</button>
            <button onclick="appendValue('/')" class="btn-op">÷</button>
            
            <button onclick="appendValue('7')" class="btn-num">7</button>
            <button onclick="appendValue('8')" class="btn-num">8</button>
            <button onclick="appendValue('9')" class="btn-num">9</button>
            <button onclick="appendValue('*')" class="btn-op">×</button>
            
            <button onclick="appendValue('4')" class="btn-num">4</button>
            <button onclick="appendValue('5')" class="btn-num">5</button>
            <button onclick="appendValue('6')" class="btn-num">6</button>
            <button onclick="appendValue('-')" class="btn-op">−</button>
            
            <button onclick="appendValue('1')" class="btn-num">1</button>
            <button onclick="appendValue('2')" class="btn-num">2</button>
            <button onclick="appendValue('3')" class="btn-num">3</button>
            <button onclick="appendValue('+')" class="btn-op">+</button>
            
            <button onclick="appendValue('0')" class="btn-num span-two">0</button>
            <button onclick="appendValue('.')" class="btn-num">.</button>
            <button onclick="calculate()" class="btn-eq">=</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
